<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="style.css" />
        <title>CRUD DE PELÍCULAS CON EXPRESS Y FETCH</title>
    </head>

    <body>
        <h1>New Movies</h1>

        <form action="/anadir-pelicula" method="post" id="form-pelicula">
            <label>
                Título
                <input
                    id="titulo"
                    type="text"
                    name="titulo"
                    placeholder="Ej: Love"
                    required
                />
            </label>

            <label>
                Director
                <input
                    id="director"
                    type="text"
                    name="director"
                    placeholder="Ej: abcdefd hijkl"
                    required
                />
            </label>

            <label>
                Año
                <input
                id="anio"
                    type="number"
                    name="anio"
                    min="1800"
                    max="2200"
                    placeholder="2026"
                    required
                />
            </label>

            <div class="botones-form">
                <button type="submit" class="btn-submit" id="btn-submit">
                    Guardar película
                </button>
                <button type="button" id="btn-cancelar" class="btn-cancelar">
                    Cancelar
                </button>
            </div>

            <input type="hidden" name="id" id="input-id">

        </form>
        
        <ul class="caja-peliculas"></ul>

        <script src="app.js"></script>
    </body>
</html>
