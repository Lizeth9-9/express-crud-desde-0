<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
       <link rel="stylesheet" href="style.css">
        <title>CRUD DE PELÍCULAS CON EXPRESS Y FETCH</title>
    </head>

    <body>
        <h1>New Movies</h1>

        <form action="/anadir-pelicula" method="post" id="form-pelicula" >
            <label>
                Título
                <input
                    type="text"
                    name="titulo"
                    placeholder="Ej: Love"
                    required
                />
            </label>

            <label>
                Director
                <input
                    type="text"
                    name="director"
                    placeholder="Ej: abcdefd hijkl"
                    required
                />
            </label>

            <label>
                Año
                <input
                    type="number"
                    name="anio"
                    min="1800"
                    max="2200"
                    placeholder="2026"
                    required
                />
            </label>

            <div class="botones-form">
                <button type="submit" class="btn-submit">
                    Guardar película
                </button>
                <button type="button" id="btn-cancelar" class="btn-cancelar">
                    Cancelar
                </button>
            </div>
        </form>
        <ul class="caja-peliculas"></ul>

        <script src="app.js"></script>
    </body>
</html>
